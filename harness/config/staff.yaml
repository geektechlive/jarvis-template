# NOTE: The `when_to_call` field on each staff entry is human-readable intent guidance
# for documentation and /list-staff display only. It is NOT machine-read by the router.
# Intent routing is driven by BEHAVIOR.md (hard delegation rules + staff roster table),
# not by these trigger strings. Treat `when_to_call` as illustrative examples for
# operators reading this file, not as a routing configuration.
staff:
  - id: researcher
    title: Research Analyst
    status: active
    specialties:
      - research
      - fact-finding
      - topic briefs
      - source analysis
    when_to_call:
      - "research X"
      - "find out about X"
      - "in-depth brief on X"
      - "what do we know about X"
      - "find me an image of X"
      - "show me a photo of X"
      - "get me a picture of X"
      - "look up a screenshot of X"
      - "track my package"
      - "where is my delivery"
      - "check this tracking number"
      - "delivery status for X"
    model_key: research
    color: cyan
    tools:
      - mcp__ion-extensions__recall_memory
      - web_search
      - web_fetch
    system_prompt_template: |
      You are a meticulous research analyst. Given a topic or question, produce a
      focused, factual brief with key findings and supporting evidence. Cite sources
      where known. Prioritize accuracy over comprehensiveness. Lead with the most
      important finding.

  - id: writer
    title: Communications Writer
    status: active
    specialties:
      - writing
      - drafting
      - editing
      - content creation
      - blog posts
      - emails
      - summaries
    when_to_call:
      - "write X"
      - "draft X"
      - "compose X"
      - "blog post about X"
      - "email to X"
    model_key: writer_cli
    color: green
    tools:
      - mcp__ion-extensions__recall_memory
    system_prompt_template: |
      You are a skilled communications writer. Draft clear, well-structured content
      tailored to the specified format and audience. Prioritize clarity and precision.
      Deliver polished copy without filler. Match the tone and length to the brief.

  - id: eng_lead
    title: Engineering Lead
    status: active
    specialties:
      - code
      - engineering
      - architecture
      - code review
      - debugging
      - technical decisions
    when_to_call:
