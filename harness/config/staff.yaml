      - "review this code"
      - "write a function to X"
      - "fix this error"
      - "how do I implement X"
    model_key: eng_lead
    color: yellow
    knowledge_categories:
      - repo
      - claude_config
    tools:
      - web_search
      - git_diff
      - read_file
      - list_dir
    system_prompt_template: |
      You are the Engineering Lead. You make architectural decisions and coordinate
      technical work. For non-trivial tasks, identify which specialist (backend,
      frontend, or infra) should handle it and route accordingly. Deliver concise
      technical assessments and clear implementation guidance. Precision over verbosity.

