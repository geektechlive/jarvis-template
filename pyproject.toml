[project]
name = "harness"
version = "0.1.0"
description = "Personal always-on AI agent with local Ollama inference"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.3",
  "anthropic>=0.50",
  "chromadb>=0.5",
  "aiosqlite>=0.20",
  "click>=8.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "rich>=13.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "ddgs>=9.0",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "apscheduler>=3.10,<4",
  "textual>=0.50",
  "keyring>=24.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12.0",
  "python-dateutil>=2.8",
  "duckdb>=1.0",
]

[project.optional-dependencies]
rerank = [
  "sentence-transformers>=3",
]
# PDF text extraction for scripts/ingest-doc.py (ingest_document tool).
# Pure-Python, no system deps. Install on Mini: uv sync --extra pdf
pdf = [
  "pypdf>=4.0",
]
voice = [
  "elevenlabs>=1.0",
  "mlx-audio>=0.1",
  "soundfile>=0.12",
  "numpy>=1.26",
]
# Apple EventKit via PyObjC -- future upgrade path once TCC + daemon
# compatibility is confirmed. For now the calendar skill uses osascript.
# Install on macOS: uv sync --extra apple
apple = [
  "pyobjc-framework-EventKit>=10.0; sys_platform == 'darwin'",
]
# Graphiti temporal knowledge graph -- requires Neo4j 5.26+.
# Install on NAS/local Neo4j setups: uv sync --extra graph
graph = [
  "graphiti-core>=0.3",
  "json-repair>=0.30",
]

[dependency-groups]
dev = [
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
