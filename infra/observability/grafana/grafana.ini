# Deployed & verified live on the M2 Mini (2026-06-22).
# Minimal Grafana OSS overrides for the Jarvis observability stack.
# Grafana ships with a full default config; only fields that differ from
# defaults appear here. Every other setting is inherited from the Homebrew
# default config at /opt/homebrew/share/grafana/conf/defaults.ini.
#
# Deploy path (on Mini):
#   ~/Jarvis/infra/observability/grafana/grafana.ini
# Loaded by:
#   com.example.grafana.plist via --config flag
# Rollback:
#   launchctl unload ~/Library/LaunchAgents/com.example.grafana.plist
#   (Grafana stops; nothing else is affected)

[paths]
# Tell Grafana where to find provisioning files (datasources, dashboards).
# Must be an absolute path. Homebrew formula default is /opt/homebrew/share/grafana/conf/provisioning.
provisioning = /Users/<username>/Jarvis/infra/observability/grafana/provisioning

[server]
http_port = 3000
# Bind only to loopback; LAN access comes through the host IP directly.
# Change to 0.0.0.0 if LAN binding is needed without a reverse proxy.
http_addr = 0.0.0.0
# 0.0.0.0 = all interfaces; LAN clients reach Grafana at <mac-mini-ip>:3000.
# Canonical URL for internal link generation; update if a tunnel is added.
root_url = http://<mac-mini-ip>:3000

[security]
# Disable anonymous access. This is a personal box but dashboards read
# live system + financial-adjacent data; always require login.
allow_embedding = false
# Force HTTPS cookies only when served over HTTPS. Leave false for LAN HTTP.
cookie_secure = false
# Grafana default admin user. Change the password on first login.
admin_user = admin
# Leaving admin_password blank means Grafana uses its own first-run prompt.
# Do NOT set a password here — it would be committed to the repo.

[users]
# Disable self-registration. This instance is single-user.
allow_sign_up = false
# Structural fallback theme. jarvis-theme.css (injected via index.html patch)
# overrides the palette on top of this. Keep dark so stock Grafana chrome is
# dark-mode while the patch is absent or after an upgrade wipes it.
default_theme = dark

[auth.anonymous]
enabled = false

[analytics]
# Disable Grafana's telemetry reporting to grafana.com.
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console file
level = info
